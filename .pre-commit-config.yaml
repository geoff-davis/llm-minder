# Git hooks for llm-minder, run via prek (Rust reimplementation of
# pre-commit; same config format).
# Install: uv run prek install
# (installs both the pre-commit and pre-push hook types; see
# default_install_hook_types below)
# Run manually: uv run prek run --all-files
#
# Ruff, mypy and ty are local hooks that call the versions in uv.lock, and
# markdownlint uses the version in package-lock.json, so hooks, `make ci` and
# CI cannot drift apart.

default_install_hook_types: [pre-commit, pre-push]

# Hooks without an explicit `stages` run in every installed stage; keep the
# lint/type/format hooks at commit time only so pushes stay fast — only the
# check-branch-fresh guard below runs at push.
default_stages: [pre-commit]

repos:
  # Refuse pushes from a branch based on a stale main (multi-machine
  # development guard; see AGENTS.md "Before starting work").
  - repo: local
    hooks:
      - id: check-branch-fresh
        name: check-branch-fresh
        entry: scripts/check_branch_fresh.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  # Python tools are local hooks that run the versions locked in uv.lock, the
  # same ones `make ci` and CI use, so there is no hook `rev` to keep in step.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        exclude: ^examples/
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        exclude: ^examples/
      # Checks the whole package with the project's real dependencies, as
      # `make typecheck` does, rather than only the staged files.
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src/llm_minder/ --ignore-missing-imports
        language: system
        pass_filenames: false
        files: ^(src/llm_minder/|pyproject\.toml$)
      - id: ty
        name: ty
        entry: uv run --locked ty check src
        language: system
        pass_filenames: false
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

  # General code quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict
      # Check for merge conflicts
      - id: check-merge-conflict
      # Check YAML syntax
      - id: check-yaml
      # Check TOML syntax
      - id: check-toml
      # Ensure files end with newline
      # (stages pinned: these upstream hooks declare pre-push in their own
      # definitions, which would override default_stages and re-run them on
      # every push)
      # Fixtures under tests/fixtures/ are kept byte-for-byte as the release that
      # wrote them, so these two fixers skip them.
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: ^tests/fixtures/
      # Trim trailing whitespace
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: ^tests/fixtures/
      # Check for accidentally committed large files
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]
      # Prevent committing directly to main
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # Markdown linting with the markdownlint-cli2 pinned in package-lock.json.
  # Skips with a message when node_modules is absent (run `npm ci`); CI's
  # quality job enforces it either way.
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: scripts/markdownlint_hook.sh --fix
        language: system
        files: \.(md|markdown)$
        exclude: ^docs/archive/
        # One invocation, so the skip message prints once.
        require_serial: true
        # Shows the skip message; the script prints nothing else on success.
        verbose: true
