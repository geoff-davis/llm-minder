name: Documentation

on:
  push:
    branches:
      - main

# Queue deploys per-ref without cancelling a mid-flight gh-pages push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7.0.1
        # A transfer below 1 byte/s for 60 s aborts, so checkout's own fetch
        # retries can run instead of hanging; the step cap bounds the rest.
        timeout-minutes: 5
        continue-on-error: true
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1"
          GIT_HTTP_LOW_SPEED_TIME: "60"

      # One fresh attempt if the first checkout failed or timed out.
      - name: Retry checkout
        if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1"
          GIT_HTTP_LOW_SPEED_TIME: "60"

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # Only the docs group; --no-sync stops `uv run` adding the default dev group.
        run: uv sync --no-default-groups --group docs

      - name: Build and deploy docs
        run: uv run --no-sync mkdocs gh-deploy --force --strict
