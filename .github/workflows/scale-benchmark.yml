# Manual 100k/1m scale-soak runs (benchmarks/scale_soak). Uploads the JSON
# report and log as workflow artifacts for maintainer review — results become
# published claims only when a maintainer deliberately records them in docs.
name: Scale Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Harness profile
        type: choice
        options: [ci, 100k, 1m]
        default: 100k
      scenario:
        description: Scenario (all = profile default set)
        type: choice
        options:
          - all
          - healthy
          - slow_consumer
          - rate_limit_wave
          - transport_retry
          - validation_recovery
          - stop_resume
          - artifact_bench
          - progress_overhead
          - token_quota_mixed
        default: all
      store:
        description: Artifact store backend
        type: choice
        options: [sqlite, jsonl, none]
        default: sqlite
      durability:
        description: SQLite durability
        type: choice
        options: [balanced, full]
        default: balanced

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Check out repository
      id: checkout
      uses: actions/checkout@v7.0.1
      # A transfer below 1 byte/s for 60 s aborts, so checkout's own fetch
      # retries can run instead of hanging; the step cap bounds the rest, and two
        # 2-minute attempts leave the job's own budget for its work.
      timeout-minutes: 2
      continue-on-error: true
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1"
        GIT_HTTP_LOW_SPEED_TIME: "60"

    # One fresh attempt if the first checkout failed or timed out.
    - name: Retry checkout
      if: steps.checkout.outcome != 'success'
      uses: actions/checkout@v7.0.1
      timeout-minutes: 2
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1"
        GIT_HTTP_LOW_SPEED_TIME: "60"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Run scale-soak profile
      run: |
        SCENARIO_ARG=""
        if [ "${{ inputs.scenario }}" != "all" ]; then
          SCENARIO_ARG="--scenario ${{ inputs.scenario }}"
        fi
        uv run python -m benchmarks.scale_soak \
          --profile "${{ inputs.profile }}" \
          $SCENARIO_ARG \
          --store "${{ inputs.store }}" \
          --durability "${{ inputs.durability }}" \
          --output "benchmark-results/scale-${{ inputs.profile }}.json" \
          2>&1 | tee benchmark-results/scale-${{ inputs.profile }}.log

    - name: Upload report and log
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: scale-soak-${{ inputs.profile }}-${{ github.run_id }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 90
