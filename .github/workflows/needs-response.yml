name: Needs response

# Weekly backstop so outside issues and PRs don't sit unanswered: keeps one
# "needs-response-digest" issue open (and @mentions the maintainer) while any
# open item's latest human activity isn't from a maintainer. See
# scripts/needs_response.py.

on:
  schedule:
    - cron: "0 15 * * 1"  # Mondays 15:00 UTC
  workflow_dispatch:

concurrency:
  group: needs-response
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7.0.1
        # A transfer below 1 byte/s for 60 s aborts, so checkout's own fetch
        # retries can run instead of hanging; the step cap bounds the rest.
        timeout-minutes: 5
        continue-on-error: true
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1"
          GIT_HTTP_LOW_SPEED_TIME: "60"

      # One fresh attempt if the first checkout failed or timed out.
      - name: Retry checkout
        if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1"
          GIT_HTTP_LOW_SPEED_TIME: "60"

      - name: Update the needs-response digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/needs_response.py --update-digest
