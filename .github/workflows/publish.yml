name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Required for trusted publishing (OIDC)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Check out repository
      id: checkout
      uses: actions/checkout@v7.0.1
      # A transfer below 1 byte/s for 60 s aborts, so checkout's own fetch
      # retries can run instead of hanging; the step cap bounds the rest, and two
        # 2-minute attempts leave the job's own budget for its work.
      timeout-minutes: 2
      continue-on-error: true
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1"
        GIT_HTTP_LOW_SPEED_TIME: "60"

    # One fresh attempt if the first checkout failed or timed out.
    - name: Retry checkout
      if: steps.checkout.outcome != 'success'
      uses: actions/checkout@v7.0.1
      timeout-minutes: 2
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1"
        GIT_HTTP_LOW_SPEED_TIME: "60"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Verify tag matches pyproject.toml version
      run: |
        PKG_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PKG_VERSION}."
          echo "::error::Publishing would upload mislabeled code to PyPI. Bump the version (release-prep flow) before tagging."
          exit 1
        fi

    - name: Run tests
      run: uv run pytest

    - name: Lint
      run: uv run ruff check src/ tests/

    - name: Type check
      run: uv run mypy src/llm_minder/ --ignore-missing-imports

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    environment:
      name: pypi
      url: https://pypi.org/project/llm-minder/

    steps:
    - name: Check out repository
      id: checkout
      uses: actions/checkout@v7.0.1
      # A transfer below 1 byte/s for 60 s aborts, so checkout's own fetch
      # retries can run instead of hanging; the step cap bounds the rest, and two
        # 2-minute attempts leave the job's own budget for its work.
      timeout-minutes: 2
      continue-on-error: true
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1"
        GIT_HTTP_LOW_SPEED_TIME: "60"

    # One fresh attempt if the first checkout failed or timed out.
    - name: Retry checkout
      if: steps.checkout.outcome != 'success'
      uses: actions/checkout@v7.0.1
      timeout-minutes: 2
      env:
        GIT_HTTP_LOW_SPEED_LIMIT: "1"
        GIT_HTTP_LOW_SPEED_TIME: "60"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0

    - name: Set up Python
      run: uv python install 3.12

    - name: Build package and check metadata
      run: make package-check

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
